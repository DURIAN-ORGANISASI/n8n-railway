<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">n8n on Railway architecture</title>
<desc id="desc">Public HTTPS domain routes to an n8n service, which connects privately to PostgreSQL and stores local state on a persistent Railway volume.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09111F"/><stop offset="1" stop-color="#171C39"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8B7CFF"/><stop offset="1" stop-color="#36D6E8"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#91A7D7" fill-opacity=".16"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020617" flood-opacity=".35"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5BD9E8"/></marker>
</defs>
<rect width="1200" height="520" rx="26" fill="url(#background)"/>
<rect width="1200" height="520" rx="26" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="518" rx="25" fill="none" stroke="#334667"/>
<text x="56" y="58" fill="#F4F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="850">N8N + POSTGRESQL ON RAILWAY</text>
<text x="56" y="86" fill="#A6B6D0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Deployment layout · HTTPS ingress · private database connection · persistent storage</text>

<g filter="url(#shadow)">
  <rect x="56" y="164" width="245" height="132" rx="18" fill="#121E33" stroke="#425A7B"/>
  <rect x="56" y="164" width="245" height="7" rx="3.5" fill="url(#accent)"/>
  <circle cx="93" cy="207" r="17" fill="#202F4C" stroke="#6177A1"/>
  <path d="M85 207h16M93 199v16" stroke="#67D9E7" stroke-width="2.5" stroke-linecap="round"/>
  <text x="120" y="209" fill="#F4F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">Browser / APIs</text>
  <text x="78" y="246" fill="#C3D1E5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Public Railway domain</text>
  <text x="78" y="269" fill="#8EA5C6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">HTTPS + webhook endpoints</text>

  <rect x="425" y="142" width="350" height="176" rx="20" fill="#17233B" stroke="#6D78BE" stroke-width="1.5"/>
  <rect x="425" y="142" width="350" height="8" rx="4" fill="url(#accent)"/>
  <rect x="452" y="174" width="45" height="45" rx="13" fill="#252C50" stroke="#5F70A9"/>
  <path d="M465 194h19M474.5 184.5v19" stroke="#7DE5EE" stroke-width="3" stroke-linecap="round"/>
  <text x="514" y="195" fill="#F4F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="850">n8n service</text>
  <text x="452" y="243" fill="#C3D1E5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Workflow engine + web editor</text>
  <text x="452" y="267" fill="#8EA5C6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Port 5678 · version pinned in Dockerfile</text>
  <rect x="452" y="284" width="128" height="22" rx="11" fill="#1A4A59" stroke="#286E7F"/>
  <text x="516" y="299" text-anchor="middle" fill="#8CF1F4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800">ENCRYPTION KEY</text>

  <rect x="899" y="132" width="245" height="144" rx="18" fill="#121E33" stroke="#425A7B"/>
  <rect x="899" y="132" width="245" height="7" rx="3.5" fill="#4C9FC1"/>
  <ellipse cx="938" cy="180" rx="20" ry="8" fill="#253F5E" stroke="#69B8D0" stroke-width="1.5"/>
  <path d="M918 180v31c0 5 9 9 20 9s20-4 20-9v-31M918 195c0 5 9 9 20 9s20-4 20-9" fill="none" stroke="#69B8D0" stroke-width="1.5"/>
  <text x="972" y="183" fill="#F4F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">PostgreSQL</text>
  <text x="921" y="239" fill="#C3D1E5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Railway service reference</text>
  <text x="921" y="259" fill="#8EA5C6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Keep database private</text>

  <rect x="899" y="324" width="245" height="126" rx="18" fill="#121E33" stroke="#425A7B"/>
  <rect x="899" y="324" width="245" height="7" rx="3.5" fill="#7F8BFA"/>
  <path d="M923 362h29l9 10v35h-38Z" fill="#253253" stroke="#8994FF" stroke-width="1.5"/>
  <path d="M952 362v11h9M932 383h20M932 393h20" fill="none" stroke="#B4BAFF" stroke-width="1.5" stroke-linecap="round"/>
  <text x="976" y="379" fill="#F4F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800">Railway Volume</text>
  <text x="921" y="423" fill="#C3D1E5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">/home/node/.n8n</text>
  <text x="921" y="441" fill="#8EA5C6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Persist state and local key data</text>
</g>

<path d="M301 229H411" fill="none" stroke="#5BD9E8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="357" y="214" text-anchor="middle" fill="#85E7F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">HTTPS</text>
<path d="M775 204H883" fill="none" stroke="#5BD9E8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="829" y="190" text-anchor="middle" fill="#85E7F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Private network</text>
<path d="M748 318V386H883" fill="none" stroke="#A2A8FF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="781" y="365" fill="#C0C2FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Persistent files</text>

<text x="56" y="385" fill="#F4F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800">Operational safety</text>
<text x="56" y="412" fill="#B9C7DD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">• Back up PostgreSQL and keep N8N_ENCRYPTION_KEY separately.</text>
<text x="56" y="436" fill="#B9C7DD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">• Review permission workarounds; RAILWAY_RUN_UID=0 runs the process as root.</text>
<text x="56" y="484" fill="#7F95B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Conceptual diagram only. Actual service names and Railway settings may differ by project.</text>
</svg>