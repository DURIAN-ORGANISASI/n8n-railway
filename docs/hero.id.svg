<text x="48" y="94" fill="#F7F8FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="850">n8n + PostgreSQL, tertata rapi.</text><text x="48" y="120" fill="#A9B8D6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Template Railway dengan konfigurasi eksplisit, data persisten, dan encryption key yang aman.</text>
