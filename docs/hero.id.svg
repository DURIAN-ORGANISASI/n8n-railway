<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">n8n Railway Starter — deployment overview</title><desc id="desc">Illustration showing a public HTTPS domain, the n8n service, PostgreSQL, and a persistent Railway volume.</desc>
